<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Konsep F1 — Buku Berdiri | Tharra</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300..900;1,9..144,300..900&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/* KONSEP F1 — buku tertutup 3D, CSS murni (tanpa gambar).
   Teknik mengikuti artikel "Create an animated 3D book in CSS":
   sampul = bidang depan, blok halaman = bidang yang diputar 90° di tepi buku.
   Buku dimiringkan -26° supaya tepi halaman (fore-edge) terlihat. */
:root{
  --cover:#5C2018; --cover2:#3E120C; --paper:#F2E7CB;
  --red:#B4311F; --green:#3F5A38; --gold:#D9B87C;
  --T:46px; /* tebal buku */
  --fd:"Fraunces",Georgia,serif; --fm:"IBM Plex Mono",ui-monospace,monospace;
}
*{box-sizing:border-box}
body{
  margin:0;min-height:100dvh;overflow-x:hidden;
  background:radial-gradient(95% 62% at 50% 0%,#F1E6CC 0%,#DCCBAA 55%,#BFA77D 100%);
  color:#241E15;font-family:var(--fm);
  display:flex;flex-direction:column;align-items:center;justify-content:center;padding:26px 18px 34px;
}

.top{
  width:min(940px,100%);display:flex;justify-content:space-between;gap:12px;
  font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:#6A5B42;margin-bottom:10px;
}

.stage{position:relative;perspective:1600px;perspective-origin:42% 40%;padding-right:110px}

/* bayangan lantai */
.stage::after{
  content:"";position:absolute;left:4%;right:22%;bottom:-30px;height:44px;z-index:-1;
  background:radial-gradient(50% 50% at 50% 50%,rgba(58,42,16,.45) 0%,rgba(58,42,16,.14) 46%,transparent 74%);
  filter:blur(4px);transform:skewX(-14deg);
}

.book{
  position:relative;width:320px;height:452px;transform-style:preserve-3d;
  transform:rotateY(-26deg) rotateX(2deg);
  transition:transform .7s cubic-bezier(.19,1,.22,1);
}
.stage:hover .book{transform:rotateY(-17deg) rotateX(1deg)}

/* blok halaman: menempel di tepi kanan, menjorok ke belakang */
.block{
  position:absolute;top:8px;bottom:8px;right:0;width:var(--T);
  transform-origin:right center;transform:rotateY(-90deg);
  background:
    linear-gradient(180deg,rgba(70,50,20,.22),transparent 18%,transparent 82%,rgba(70,50,20,.24)),
    repeating-linear-gradient(0deg,#FBF3DF 0 2px,#CFBD97 2px 3px);
  box-shadow:inset 0 0 14px rgba(70,50,20,.25);
}
/* bayangan halaman yang masuk ke balik sampul */
.block::after{
  content:"";position:absolute;inset:0;
  background:linear-gradient(90deg,rgba(50,34,12,.55) 0%,rgba(50,34,12,.12) 12%,rgba(255,255,255,.42) 30%,rgba(255,255,255,0) 60%,rgba(70,50,20,.18) 100%);
}

/* sampul depan */
.cover{
  position:absolute;inset:0;border-radius:3px 7px 7px 3px;
  background:
    repeating-linear-gradient(90deg,rgba(255,255,255,.03) 0 1px,transparent 1px 3px),
    linear-gradient(148deg,#6B271C 0%,var(--cover) 44%,var(--cover2) 100%);
  box-shadow:
    inset -18px 0 26px -22px rgba(0,0,0,.95),
    inset 0 0 0 1px rgba(217,184,124,.15),
    0 2px 3px rgba(40,12,6,.35);
  display:flex;flex-direction:column;justify-content:space-between;
  padding:32px 27px 24px;color:var(--paper);
}
/* engsel: dua garis tipis di dekat tulang */
.cover::before{
  content:"";position:absolute;left:15px;top:0;bottom:0;width:3px;
  background:linear-gradient(180deg,transparent 2%,rgba(0,0,0,.5) 10%,rgba(0,0,0,.5) 90%,transparent 98%);
}
.cover::after{
  content:"";position:absolute;left:0;top:0;bottom:0;width:15px;border-radius:3px 0 0 3px;
  background:linear-gradient(90deg,rgba(0,0,0,.6),rgba(0,0,0,.05));
}

.cover .k{font-size:8.5px;letter-spacing:.2em;text-transform:uppercase;color:rgba(242,231,203,.62)}
.cover h1{
  font-family:var(--fd);font-weight:800;font-size:54px;line-height:.84;letter-spacing:-.02em;margin:12px 0 0;
  background:linear-gradient(180deg,#F3DCAB 0%,#DEBA79 58%,#C29A55 100%);
  -webkit-background-clip:text;background-clip:text;color:transparent;
}
.cover .rule{height:1px;width:60px;background:rgba(217,184,124,.5);margin:16px 0 12px}
.cover p{
  font-family:var(--fd);font-style:italic;font-size:14.5px;line-height:1.5;
  margin:0;color:rgba(242,231,203,.92);max-width:19ch;
}
.cover .board{position:absolute;left:2px;right:6px;bottom:-3px;height:4px;border-radius:0 0 6px 2px;
  background:linear-gradient(180deg,#3B1109,#200A05);box-shadow:0 2px 4px rgba(30,10,4,.5)}
.cover .foot{font-size:8px;letter-spacing:.2em;text-transform:uppercase;color:rgba(242,231,203,.45)}

/* tab indeks di tepi halaman */
.tabs{
  position:absolute;top:18%;left:100%;
  display:flex;flex-direction:column;gap:10px;transform:translateX(4px) translateZ(1px);
}
.tab{
  display:flex;align-items:center;gap:10px;text-decoration:none;white-space:nowrap;
  background:#F7EED8;color:#2A2118;padding:12px 16px;border-radius:0 3px 3px 0;
  font-size:10px;letter-spacing:.15em;text-transform:uppercase;
  box-shadow:2px 4px 9px -6px rgba(0,0,0,.85), inset 0 0 0 1px rgba(120,100,60,.22);
  transition:transform .2s ease, background .2s ease;
}
.tab{position:relative}
.tab::after{content:"";position:absolute;left:0;top:0;bottom:0;width:5px;
  background:linear-gradient(90deg,rgba(60,44,18,.45),transparent);border-radius:3px 0 0 3px}
.tab::before{content:"";width:5px;height:26px;border-radius:1px;background:var(--red);flex:none}
.tab.a::before{background:var(--green)}
.tab:hover{background:#FFFDF4;transform:translateX(3px)}
.tab:focus-visible{outline:2px solid var(--red);outline-offset:3px}

.foot{
  width:min(940px,100%);display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;
  margin-top:64px;font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;color:#6A5B42;
}
.foot a{color:inherit;text-decoration:none;min-height:32px;display:inline-flex;align-items:center}

@media(max-width:760px){
  .stage{padding-right:0;perspective:1200px;perspective-origin:50% 35%}
  .book{width:250px;height:352px;transform:rotateY(-14deg)}
  .cover h1{font-size:42px}
  .cover p{font-size:13px}
  .tabs{position:relative;top:auto;left:auto;transform:none;flex-direction:row;gap:8px;
    margin-top:26px;justify-content:center}
  .tab{border-radius:3px;font-size:9px;padding:11px 14px}
  .foot{margin-top:26px}
}
</style>
</head>
<body>

<div class="top"><span>Tharra · OSIS Humas</span><span>Buku ruang · MMXXV</span></div>

<div class="stage">
  <div class="book">
    <div class="block"></div>
    <div class="cover">
      <div>
        <span class="k">Buku ruang · OSIS Humas</span>
        <h1>THARRA</h1>
        <div class="rule"></div>
        <p>Katakan &amp; Aksara — dua ruang untuk sekolah yang sama.</p>
      </div>
      <span class="foot">Edisi MMXXV</span>
      <span class="board" aria-hidden="true"></span>
    </div>

    <div class="tabs">
      <a class="tab" href="../index.html">Katakan</a>
      <a class="tab a" href="../index.html">Aksara</a>
    </div>
  </div>
</div>

<div class="foot">
  <span>Tharra — Katakan &amp; Aksara</span>
  <a href="index.html">← daftar konsep</a>
</div>

</body>
</html>
