<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Konsep E2 — Sampul Buku | Tharra</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300..900;1,9..144,300..900&family=IBM+Plex+Mono:wght@400;500&family=Cormorant+Garamond:ital,wght@0,400;1,400&display=swap" rel="stylesheet">
<style>
/* KONSEP E2 — Sampul buku tertutup.
   Beranda = sampul: kain gelap, huruf foil, pita kertas (obi), tepi halaman.
   Dua ruang disebut di pita; masuk lewat "buka". */
:root{
  --room:#241E16; --cover:#5E2016; --cover-2:#4A180F; --foil:#E8C98A;
  --paper:#F3EAD3; --ink:#1E1810; --red:#C05A3A;
  --fd:"Fraunces",serif; --fc:"Cormorant Garamond",serif; --fm:"IBM Plex Mono",monospace;
}
*{box-sizing:border-box}
body{
  margin:0;min-height:100dvh;background:radial-gradient(120% 90% at 50% 0%, #2A2118 0%, #17120C 55%, #0D0A06 100%);
  color:var(--paper);display:flex;flex-direction:column;align-items:center;justify-content:center;
  padding:28px 16px;font-family:var(--fm);overflow-x:hidden;
}
/* cahaya meja */
body::before{
  content:"";position:fixed;inset:0;pointer-events:none;
  background:radial-gradient(40% 30% at 50% 12%, rgba(232,201,138,.16) 0%, transparent 70%);
}

.stage{position:relative;perspective:1400px;margin-bottom:26px}

.book{
  position:relative;width:min(340px,80vw);aspect-ratio:3/4.2;
  border-radius:6px 12px 12px 6px;
  background:
    repeating-linear-gradient(92deg, rgba(0,0,0,.16) 0 1px, transparent 1px 3px),
    linear-gradient(145deg, var(--cover) 0%, var(--cover-2) 100%);
  box-shadow:
    inset -18px 0 26px -20px rgba(0,0,0,.9),
    inset 12px 0 18px -14px rgba(255,255,255,.18),
    0 34px 60px -30px rgba(0,0,0,.9);
  transform:rotateY(-14deg) rotateX(4deg);
  transform-style:preserve-3d;
  transition:transform .6s cubic-bezier(.19,1,.22,1);
}
.book:hover{transform:rotateY(-6deg) rotateX(2deg) translateY(-4px)}

/* tulang buku */
.book::before{
  content:"";position:absolute;left:0;top:0;bottom:0;width:16px;
  background:linear-gradient(90deg, rgba(0,0,0,.55), transparent);
  border-radius:6px 0 0 6px;
}
/* tepi halaman di kanan */
.book::after{
  content:"";position:absolute;right:-7px;top:6px;bottom:6px;width:9px;
  border-radius:0 3px 3px 0;
  background:repeating-linear-gradient(0deg, #E9DFC5 0 1px, #C9BC9C 1px 2px);
  box-shadow:2px 0 8px rgba(0,0,0,.5);
}

/* isi sampul */
.inside{position:absolute;inset:0;padding:34px 26px 26px;display:flex;flex-direction:column}
.brand{
  font-family:var(--fd);font-weight:800;font-size:clamp(30px,8vw,44px);letter-spacing:-.03em;
  margin:0;background:linear-gradient(180deg,#F3DCA8 0%,#D9B679 55%,#B08A45 100%);
  -webkit-background-clip:text;background-clip:text;color:transparent;
  text-shadow:0 1px 0 rgba(0,0,0,.35);
}
.brand span{-webkit-text-fill-color:var(--red)}

.rule{height:1px;background:linear-gradient(90deg, rgba(232,201,138,.6), transparent);margin:14px 0 12px}

.sub{
  font-family:var(--fm);font-size:8.5px;letter-spacing:.24em;text-transform:uppercase;
  color:rgba(243,234,211,.65);margin:0 0 6px;
}
.title{
  font-family:var(--fc);font-style:italic;font-size:clamp(17px,4.4vw,21px);
  color:rgba(243,234,211,.92);line-height:1.3;margin:0;
}

/* pita kertas (obi) */
.obi{
  position:absolute;left:-14px;right:-14px;bottom:74px;padding:12px 18px;
  background:var(--paper);color:var(--ink);transform:rotate(-1.2deg);
  box-shadow:0 10px 20px -12px rgba(0,0,0,.9);
}
.obi b{display:block;font-family:var(--fd);font-weight:700;font-size:13px;letter-spacing:-.01em}
.obi span{display:block;margin-top:3px;font-size:7.5px;letter-spacing:.18em;text-transform:uppercase;color:#6B5B41}

/* tombol buka */
.open{
  align-self:flex-start;margin-top:auto;display:inline-flex;align-items:center;gap:8px;
  text-decoration:none;color:var(--paper);
  font-size:9px;letter-spacing:.2em;text-transform:uppercase;
  border-bottom:1px solid rgba(243,234,211,.45);padding-bottom:3px;
}
.open:hover{color:var(--foil);border-color:var(--foil)}

/* keterangan di luar buku */
.caption{text-align:center;font-size:8.5px;letter-spacing:.2em;text-transform:uppercase;color:rgba(243,234,211,.45)}
.caption a{color:inherit;text-decoration:none;border-bottom:1px solid rgba(243,234,211,.25)}

@media(max-width:520px){
  .book{transform:rotateY(-7deg) rotateX(2deg)}
  .inside{padding:26px 20px 22px}
  .obi{bottom:64px}
}
</style>
</head>
<body>

<div class="stage">
  <div class="book">
    <div class="inside">
      <h1 class="brand">THARRA<span>.</span></h1>
      <div class="rule"></div>
      <p class="sub">Buku ruang · OSIS Humas</p>
      <p class="title">Katakan &amp; Aksara — dua ruang untuk sekolah yang sama.</p>

      <a class="open" href="../index.html">Buka buku →</a>
    </div>

    <div class="obi">
      <b>Katakan &amp; Aksara</b>
      <span>Edisi MMXXV · untuk siswa</span>
    </div>
  </div>
</div>

<p class="caption"><a href="index.html">← daftar konsep</a></p>

</body>
</html>
