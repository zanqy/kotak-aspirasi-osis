<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Konsep D3 — Tipografi Luap | Tharra</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300..900;1,9..144,300..900&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/* KONSEP D3 — Tipografi yang meluap keluar layar.
   Huruf raksasa dipotong tepi layar; nama ruang jadi gambar, bukan judul.
   Paling "poster tipografi" tapi dengan pemotongan yang disengaja. */
:root{
  --paper:#F1E7D2; --ink:#1B1712; --red:#C0321D; --faint:#7C6C55;
  --fd:"Fraunces",serif; --fm:"IBM Plex Mono",monospace;
}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);overflow-x:hidden;font-family:var(--fm)}

.wrap{position:relative;min-height:100dvh;padding:20px 0 0}

.top{
  display:flex;justify-content:space-between;padding:0 20px 14px;
  font-size:8.5px;letter-spacing:.22em;text-transform:uppercase;color:var(--faint);
  border-bottom:1px solid var(--ink);
}

/* ---- blok tipografi ---- */
.type{position:relative;border-bottom:1px solid var(--ink);overflow:hidden}
.type a{display:block;text-decoration:none;color:inherit;position:relative;padding:14px 0 10px}

.word{
  font-family:var(--fd);font-weight:900;letter-spacing:-.055em;line-height:.78;
  font-size:clamp(76px,26vw,220px);
  white-space:nowrap;
  transform:translateX(-.06em);
  transition:transform .5s cubic-bezier(.19,1,.22,1), color .35s ease;
}
.type:hover .word{transform:translateX(-.02em)}
.type.k .word{color:var(--ink)}
.type.a .word{color:transparent;-webkit-text-stroke:2.5px var(--ink)}
.type.a:hover .word{color:var(--red);-webkit-text-stroke:2.5px var(--red)}

.word i{font-style:normal;color:var(--red)}
.type.a .word i{-webkit-text-stroke:0;color:var(--red)}

/* keterangan kecil menempel di huruf */
.meta{
  position:absolute;right:20px;bottom:22px;text-align:right;max-width:44%;
}
.meta .lab{
  display:block;font-size:8px;letter-spacing:.2em;text-transform:uppercase;color:var(--faint);
}
.meta .txt{
  display:block;margin-top:4px;font-family:var(--fd);font-size:13px;line-height:1.45;color:#4A3E2C;
}
.meta .go{
  display:inline-block;margin-top:8px;font-size:9px;letter-spacing:.16em;text-transform:uppercase;
  color:var(--red);border-bottom:1px solid rgba(192,50,29,.5);padding-bottom:2px;
}

/* nomor besar di kiri, menempel tepi */
.idx{
  position:absolute;left:-6px;top:8px;font-family:var(--fm);font-size:9px;
  letter-spacing:.2em;color:var(--faint);writing-mode:vertical-rl;text-orientation:mixed;
}

/* ---- kaki ---- */
.foot{
  display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;
  padding:14px 20px 24px;font-size:8.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--faint);
}
.foot a{color:inherit;text-decoration:none}

/* garis bantu vertikal, seperti grid poster */
.grid-line{
  position:absolute;top:0;bottom:0;width:1px;background:rgba(27,23,18,.14);pointer-events:none;
}
.g1{left:20px}.g2{right:20px}

@media(max-width:560px){
  .word{font-size:clamp(64px,22vw,120px)}
  .meta{position:relative;right:auto;bottom:auto;max-width:none;padding:0 20px 16px;text-align:left}
}
</style>
</head>
<body>
<div class="wrap">
  <div class="grid-line g1"></div>
  <div class="grid-line g2"></div>

  <div class="top">
    <span>Tharra · OSIS Humas</span>
    <span>Dua ruang · MMXXV</span>
  </div>

  <section class="type k">
    <a href="../index.html">
      <span class="idx">01</span>
      <div class="word">KATA<i>KAN</i></div>
      <div class="meta">
        <span class="lab">Kotak aspirasi · anonim</span>
        <span class="txt">Tulis yang belum sempat kamu ucapkan.</span>
        <span class="go">Tulis →</span>
      </div>
    </a>
  </section>

  <section class="type a">
    <a href="../index.html">
      <span class="idx">02</span>
      <div class="word">AK<i>SARA</i></div>
      <div class="meta">
        <span class="lab">Mading &amp; surat · perlu akun</span>
        <span class="txt">Tempel, baca, dan kirim surat ke teman sekelas.</span>
        <span class="go">Buka →</span>
      </div>
    </a>
  </section>

  <div class="foot">
    <span>Tharra — Katakan &amp; Aksara</span>
    <a href="index.html">← daftar konsep</a>
  </div>
</div>
</body>
</html>
