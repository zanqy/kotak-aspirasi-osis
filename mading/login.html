<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Masuk - Mading Digital OSIS</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300..900;1,9..144,300..900&family=IBM+Plex+Mono:wght@400;500&family=Spectral:ital,wght@0,400;0,500;1,400;1,500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="auth-body">
  <div class="grain"></div>
  <div class="auth-card">
    <div class="auth-header">
      <div class="auth-badge">MADING DIGITAL — OSIS</div>
      <h1>Masuk ke Papan Bersama</h1>
      <p>Gunakan NIS untuk bisa menempel pesan di mading bareng seluruh siswa.</p>
    </div>
    <form id="login-form" class="auth-form">
      <label class="field">
        <span>NIS (Nomor Induk Siswa)</span>
        <input id="nis-input" inputmode="numeric" pattern="[0-9]*" placeholder="Masukkan NIS kamu" autocomplete="off" required>
      </label>
      <button class="btn btn-primary btn-full" type="submit">Masuk ke Mading</button>
    </form>
    <div class="auth-footer">
      <a class="link" href="index.html">← Kembali ke Papan Mading</a>
      <a class="link" href="moderasi.html">Panel Moderasi</a>
    </div>
    <p id="login-error" class="error-text" hidden></p>
  </div>
  <script src="js/auth.js"></script>
</body>
</html>
