<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Panel Moderasi - Mading Digital OSIS</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="moderasi-body">
  <header class="mading-header">
    <div class="header-left">
      <div class="logo-dot logo-dot-danger"></div>
      <div>
        <h1>Panel Moderasi Mading</h1>
        <p>Khusus Humas/OSIS - Jaga kebersihan papan bersama</p>
      </div>
    </div>
    <div class="header-right">
      <a class="btn btn-ghost" href="index.html"><i class="ti ti-layout-board"></i> Lihat Papan Mading</a>
      <a class="btn btn-ghost" href="login.html"><i class="ti ti-login"></i> Login</a>
    </div>
  </header>

  <main class="moderasi-wrap">
    <section class="moderasi-tabs">
      <button class="tab-btn active" data-tab="reported"><i class="ti ti-flag"></i> Perlu Ditinjau <span class="pill" id="count-reported">0</span></button>
      <button class="tab-btn" data-tab="all"><i class="ti ti-notes"></i> Semua Postingan <span class="pill" id="count-all">0</span></button>
      <button class="tab-btn" data-tab="hidden"><i class="ti ti-eye-off"></i> Disembunyikan <span class="pill" id="count-hidden">0</span></button>
    </section>

    <section class="moderasi-list" id="moderasi-list"></section>
    <div class="empty-state" id="empty-state" hidden>
      <i class="ti ti-check"></i>
      <h3>Semua aman untuk saat ini</h3>
      <p>Tidak ada postingan yang perlu ditinjau di tab ini</p>
    </div>
  </main>

  <template id="mod-item-template">
    <article class="mod-item">
      <div class="mod-item-header">
        <div class="mod-meta">
          <span class="mod-badge" data-role="status"></span>
          <span class="mod-text">oleh <strong data-role="author"></strong> • <span data-role="time"></span></span>
        </div>
        <div class="mod-reports">
          <i class="ti ti-flag"></i> <span data-role="report-count">0</span> laporan
        </div>
      </div>
      <div class="mod-preview" data-role="preview"></div>
      <div class="mod-reasons" data-role="reasons-wrap" hidden>
        <p class="mod-reasons-title">Alasan Laporan:</p>
        <ul class="mod-reasons-list" data-role="reasons"></ul>
      </div>
      <div class="mod-actions">
        <button class="btn btn-ghost btn-sm" data-action="view"><i class="ti ti-eye"></i> Lihat di Papan</button>
        <button class="btn btn-ghost btn-sm" data-action="approve"><i class="ti ti-eye-check"></i> Tampilkan Kembali</button>
        <button class="btn btn-warning btn-sm" data-action="hide"><i class="ti ti-eye-off"></i> Sembunyikan</button>
        <button class="btn btn-danger btn-sm" data-action="delete"><i class="ti ti-trash"></i> Hapus Permanen</button>
      </div>
    </article>
  </template>

  <script src="js/moderasi.js"></script>
</body>
</html>
