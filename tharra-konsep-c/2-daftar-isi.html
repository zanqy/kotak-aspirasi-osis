<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Konsep C2 — Daftar Isi | Tharra</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400..900;1,9..144,400..900&family=Spectral:ital,wght@0,300;0,400;1,300&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/* KONSEP C2 — Halaman daftar isi buku.
   Tema tetap (krem, tinta, merah). Bentuk halaman: daftar isi dengan titik-titik
   penghubung dan nomor halaman. Dua "bab", bukan dua kartu. */
:root{
  --paper:#F2ECDE; --ink:#221D15; --soft:#5C5042; --faint:#8B7B62;
  --red:#C03B21; --line:#CBBA97; --fd:"Fraunces",serif; --fs:"Spectral",serif; --fm:"IBM Plex Mono",monospace;
}
*{box-sizing:border-box}
body{
  margin:0;background:var(--paper);color:var(--ink);font-family:var(--fs);
  min-height:100dvh;display:flex;align-items:center;justify-content:center;padding:24px 18px;
}
.page{
  width:100%;max-width:660px;position:relative;
  padding:34px 26px 26px;
  background:linear-gradient(180deg, rgba(255,255,255,.45), transparent 40%);
}
/* bingkai tipis seperti halaman buku */
.page::before{
  content:"";position:absolute;inset:10px;border:1px solid var(--line);pointer-events:none;
}

.running{
  display:flex;justify-content:space-between;gap:10px;
  font-family:var(--fm);font-size:9px;letter-spacing:.22em;text-transform:uppercase;color:var(--faint);
  border-bottom:1px solid var(--line);padding-bottom:8px;
}
h1{
  font-family:var(--fd);font-weight:600;font-size:clamp(30px,6vw,42px);
  text-align:center;margin:26px 0 4px;letter-spacing:-.01em;
}
h1 em{font-style:italic;color:var(--red)}
.dek{
  text-align:center;font-family:var(--fm);font-size:9px;letter-spacing:.2em;
  text-transform:uppercase;color:var(--faint);margin:0 0 26px;
}

/* daftar */
.toc{margin:0;padding:0;list-style:none}
.toc li{border-bottom:1px dotted var(--line)}
.entry{
  display:grid;grid-template-columns:auto 1fr auto;align-items:baseline;gap:12px;
  padding:18px 4px;text-decoration:none;color:inherit;
  transition:background .2s ease, padding-left .25s ease;
}
.entry:hover{background:rgba(252,249,242,.8);padding-left:10px}
.entry:focus-visible{outline:2px solid var(--red);outline-offset:2px}

.entry .num{
  font-family:var(--fm);font-size:10px;letter-spacing:.16em;color:var(--red);
}
.entry .ttl b{
  display:block;font-family:var(--fd);font-weight:700;font-size:clamp(20px,4.2vw,26px);
  letter-spacing:-.01em;line-height:1.1;
}
.entry .ttl span{
  display:block;margin-top:4px;font-family:var(--fm);font-size:9px;letter-spacing:.16em;
  text-transform:uppercase;color:var(--faint);
}
.entry .pg{
  font-family:var(--fd);font-size:clamp(18px,3.4vw,22px);color:var(--soft);
  font-variant-numeric:tabular-nums;
}

/* catatan bawah */
.colophon{
  display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;
  margin-top:26px;font-family:var(--fm);font-size:8.5px;letter-spacing:.16em;
  text-transform:uppercase;color:var(--faint);
}
.colophon a{color:inherit;text-decoration:none;border-bottom:1px solid var(--line)}

/* ornamen kecil */
.fleuron{
  text-align:center;color:var(--line);font-size:14px;margin:18px 0 0;letter-spacing:.6em;
}
</style>
</head>
<body>
<div class="page">
  <div class="running">
    <span>Tharra · OSIS Humas</span>
    <span>MMXXV</span>
  </div>

  <h1>Daftar <em>isi</em></h1>
  <p class="dek">Dua ruang · satu sekolah</p>

  <ul class="toc">
    <li>
      <a class="entry" href="../index.html">
        <span class="num">01</span>
        <span class="ttl">
          <b>Katakan</b>
          <span>Kotak aspirasi · anonim</span>
        </span>
        <span class="pg">01</span>
      </a>
    </li>
    <li>
      <a class="entry" href="../index.html">
        <span class="num">02</span>
        <span class="ttl">
          <b>Aksara</b>
          <span>Mading &amp; surat · perlu akun</span>
        </span>
        <span class="pg">02</span>
      </a>
    </li>
  </ul>

  <p class="fleuron">· · ·</p>

  <div class="colophon">
    <span>Tharra — Katakan &amp; Aksara</span>
    <a href="index.html">← daftar konsep</a>
  </div>
</div>
</body>
</html>
