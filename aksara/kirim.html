<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f2e9d2">
<title>AKSARA. — Kirim Surat</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@700&family=Cormorant+Garamond:ital,wght@1,600&family=Fraunces:wght@700&family=La+Belle+Aurore&family=Space+Mono:wght@400;700&family=Special+Elite&display=swap" rel="stylesheet">
<style>
:root{--bg:#e9e3cf;--ink:#2a2119;--pen:#27334d;--red:#c23b22;--muted:rgba(42,33,25,.55);--rule:rgba(120,95,50,.2);--accent:#2c5d8a;
--grain:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='200' height='200'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='3' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 .35 0 0 0 0 .27 0 0 0 0 .16 0 0 0 .10 0'/></filter><rect width='100%25' height='100%25' filter='url(%23n)'/></svg>")}
*{box-sizing:border-box;margin:0;padding:0}
body{min-height:100dvh;color:var(--ink);background:var(--bg);font-family:'Space Mono',monospace;overflow-x:hidden;background-image:var(--grain),radial-gradient(ellipse at 50% -10%,#fff8e6,transparent 60%)}
button,textarea,input{font:inherit;color:inherit}button{cursor:pointer;border:0;background:none}[hidden]{display:none!important}
header{position:sticky;top:0;z-index:20;display:flex;justify-content:space-between;align-items:center;padding:calc(env(safe-area-inset-top,0px) + 12px) 18px 10px;background:rgba(233,227,207,.9);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border-bottom:1px dashed rgba(42,33,25,.25)}
.logo{font-family:Fraunces,serif;font-weight:700;font-size:25px}.logo b{color:var(--red)}
nav button{font-size:11px;letter-spacing:2px;padding:8px 11px;border-radius:99px}nav button.on{background:var(--ink);color:var(--bg)}nav a.nv{font-size:11px;letter-spacing:2px;padding:8px 11px;border-radius:99px;color:inherit;text-decoration:none}
main{max-width:520px;margin:0 auto;padding:16px 16px 50px}
.hero{display:flex;align-items:center;gap:14px;margin-bottom:14px}.stamp{width:92px;height:92px;flex:none}
.ring{transform-origin:60px 60px;animation:spin 40s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}
h1{font-family:Caveat,cursive;font-weight:700;font-size:clamp(42px,12vw,58px);line-height:.85;transform:rotate(-3deg);transform-origin:left}
.sub{font-size:10px;letter-spacing:2px;color:var(--muted);margin-top:9px;text-transform:uppercase}
.types{display:flex;gap:8px;overflow-x:auto;padding:6px 2px 8px;scrollbar-width:none}.types::-webkit-scrollbar{display:none}
.type{flex:none;display:flex;align-items:center;gap:7px;padding:8px 13px 8px 10px;border-radius:99px;background:rgba(255,252,242,.7);border:1.5px dashed rgba(42,33,25,.35);font-size:11px;letter-spacing:1.5px;transition:transform .3s cubic-bezier(.2,1.4,.4,1)}
.type i{width:14px;height:14px;border-radius:3px;background:var(--c)}
.type[aria-pressed=true]{border-style:solid;border-color:var(--ink);background:#fff;transform:translateY(-2px) rotate(-2deg)}
.hint{font-family:Fraunces,serif;font-weight:400;font-style:italic;font-size:15px;color:var(--muted);margin:2px 4px 18px;min-height:22px}

.stage{position:relative;margin:0 6px;min-height:368px;overflow:clip}
.sheet{position:relative;z-index:1;filter:drop-shadow(0 12px 14px rgba(42,33,25,.3)) drop-shadow(0 1px 1px rgba(42,33,25,.25));transform:rotate(-.5deg);transition:transform .5s,opacity .5s}
.sheet:focus-within{transform:rotate(0) translateY(-3px)}
.paper{position:relative;padding:0 20px 14px 22px;background-color:#f3e8cd;box-shadow:inset 0 0 46px rgba(150,110,50,.3);
background-image:radial-gradient(circle at 12% 20%,rgba(160,110,40,.18),transparent 9%),radial-gradient(circle at 88% 70%,rgba(160,110,40,.15),transparent 12%),radial-gradient(circle at 66% 6%,rgba(150,100,40,.13),transparent 8%),var(--grain),repeating-linear-gradient(to bottom,transparent 0 33px,var(--rule) 33px 34px);
clip-path:polygon(0 1.5%,3% 0,8% 1.2%,15% 0,24% 1.4%,33% .2%,45% 1.3%,57% 0,68% 1.2%,79% .1%,90% 1.3%,100% 0,99.3% 12%,100% 25%,99.2% 40%,100% 55%,99.4% 70%,100% 85%,99.3% 100%,90% 99.2%,78% 100%,66% 99.1%,52% 100%,40% 99.2%,27% 100%,14% 99.3%,0 100%,.7% 85%,0 70%,.8% 55%,0 40%,.6% 25%,0 12%)}
.row{display:flex;align-items:flex-end;height:34px;gap:10px}
.head{justify-content:space-between;align-items:center;font-family:'Special Elite',monospace;font-size:9.5px;letter-spacing:2px;color:rgba(42,33,25,.6);padding-top:5px}
.head span:last-child{letter-spacing:.5px;font-size:11px;font-style:italic}
.row label{font-family:'La Belle Aurore',cursive;font-size:22px;color:var(--pen);line-height:34px;white-space:nowrap}
input{background:transparent;border:0;outline:0;min-width:0;flex:1;font-family:'La Belle Aurore',cursive;font-size:22px;line-height:34px;height:34px;color:var(--pen)}
textarea{display:block;width:100%;height:204px;resize:none;background:transparent;border:0;outline:0;font-family:'Cormorant Garamond',serif;font-style:italic;font-weight:600;font-size:23px;line-height:34px;color:var(--pen);text-indent:1.6em}
input::placeholder,textarea::placeholder{color:rgba(39,51,77,.32)}
.sal{justify-content:flex-end;font-family:'Cormorant Garamond',serif;font-style:italic;font-weight:600;font-size:20px;color:var(--pen);align-items:center}
.sign{justify-content:flex-end;align-items:flex-end}.sign input{text-align:right;flex:none;width:68%}.sign span{font-family:'La Belle Aurore',cursive;color:var(--pen);line-height:34px}
.under{display:flex;justify-content:space-between;align-items:center;margin-top:14px;font-size:10px;letter-spacing:1px;color:var(--muted)}
.switch{display:flex;align-items:center;gap:9px;font-family:Fraunces,serif;font-style:italic;font-weight:400;font-size:15px;color:var(--ink)}
.switch button{width:50px;height:28px;border-radius:99px;background:#cfc3a3;position:relative;transition:background .3s;box-shadow:inset 0 2px 4px rgba(0,0,0,.15)}
.switch button::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fffdf6;box-shadow:0 2px 3px rgba(0,0,0,.25);transition:transform .35s cubic-bezier(.3,1.4,.5,1)}
.switch button[aria-checked=true]{background:var(--ink)}.switch button[aria-checked=true]::after{transform:translateX(22px)}

.envw{position:absolute;left:50%;top:128px;width:94%;height:210px;margin-left:-47%;z-index:2;perspective:1100px;opacity:0;pointer-events:none;transform:translateY(40px) scale(.92);transition:opacity .5s,transform .6s cubic-bezier(.2,1.2,.4,1)}
.env{position:absolute;inset:0;transform-style:preserve-3d;transition:transform 1s cubic-bezier(.5,0,.2,1)}
.fb,.ff{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden}
.ff{transform:rotateY(180deg);padding:9px;border-radius:4px;box-shadow:0 18px 26px -10px rgba(42,33,25,.55);background:repeating-linear-gradient(135deg,#c23b22 0 10px,#f1e6cb 10px 16px,#2c5d8a 16px 26px,#f1e6cb 26px 32px)}
.ff .in{position:absolute;inset:9px;background:#f1e6cb var(--grain)}
.back{position:absolute;inset:0;border-radius:4px;background:#e2d3ac var(--grain);box-shadow:0 18px 26px -10px rgba(42,33,25,.55)}
.flap{position:absolute;top:0;left:0;right:0;height:52%;z-index:1;clip-path:polygon(0 0,100% 0,50% 100%);background:repeating-linear-gradient(45deg,rgba(0,0,0,.07) 0 2px,transparent 2px 7px),var(--flap,#d6e5f3);transform-origin:top;transform:rotateX(180deg);transition:transform .8s cubic-bezier(.4,0,.2,1)}
.flap.shut{transform:none;z-index:5;background:var(--flap,#d6e5f3) var(--grain)}
.pocket{position:absolute;inset:0;z-index:3;border-radius:4px;background:#f2e8cf var(--grain);clip-path:polygon(0 0,50% 52%,100% 0,100% 100%,0 100%)}
.pocket::before{content:"";position:absolute;inset:0;background:linear-gradient(to top right,transparent 49.4%,rgba(120,95,50,.25) 50%,transparent 50.6%) left/50% 100% no-repeat,linear-gradient(to top left,transparent 49.4%,rgba(120,95,50,.25) 50%,transparent 50.6%) right/50% 100% no-repeat}
.fold{position:absolute;z-index:2;left:14%;width:72%;top:14px;height:150px;padding:8px 10px;background:#f3e8cd var(--grain);box-shadow:0 2px 6px rgba(0,0,0,.25);opacity:0;transform:translateY(-150px);transition:transform 1s cubic-bezier(.5,0,.3,1),opacity .3s;font-family:'La Belle Aurore',cursive;font-size:15px;color:var(--pen);
background-image:linear-gradient(to bottom,transparent 32.5%,rgba(120,95,50,.3) 33%,transparent 34%,transparent 65.5%,rgba(120,95,50,.3) 66%,transparent 67%),var(--grain)}
.seal{position:absolute;z-index:6;left:50%;top:52%;width:46px;height:46px;margin:-23px 0 0 -23px;border-radius:50%;display:grid;place-items:center;color:rgba(255,255,255,.85);font-family:Fraunces,serif;font-size:19px;background:radial-gradient(circle at 35% 30%,rgba(255,255,255,.3),transparent 40%),var(--c,#c23b22);box-shadow:0 3px 6px rgba(0,0,0,.4),inset 0 0 0 3px rgba(0,0,0,.15);opacity:0;transform:scale(2.2) rotate(-20deg);transition:opacity .15s,transform .35s cubic-bezier(.3,1.5,.5,1)}
.snd{position:absolute;left:14px;top:10px;max-width:50%;font-family:'Special Elite',monospace;font-size:8px;letter-spacing:2px;color:var(--muted)}
.snd b{display:block;font-family:'La Belle Aurore',cursive;font-weight:400;font-size:16px;letter-spacing:0;color:var(--pen);margin-top:2px}
.fst{position:absolute;right:14px;top:8px;width:50px}
.pm{position:absolute;right:6px;top:4px;width:136px;opacity:0;transform:scale(2) rotate(12deg);mix-blend-mode:multiply}
.rcp{position:absolute;left:38px;right:26px;top:94px;font-family:'Special Elite',monospace;font-size:8px;letter-spacing:2px;color:var(--muted)}
.rcp b{display:block;font-family:'La Belle Aurore',cursive;font-weight:400;font-size:25px;letter-spacing:0;color:var(--pen);line-height:34px;border-bottom:1px solid rgba(42,33,25,.3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rcp span{display:block;margin-top:9px;border-bottom:1px solid rgba(42,33,25,.3);padding-bottom:3px}
.pa{position:absolute;left:50%;bottom:8px;transform:translateX(-50%);font-family:'Special Elite',monospace;font-size:7.5px;letter-spacing:2px;color:var(--red);border:1px solid var(--red);padding:2px 6px;white-space:nowrap}

.stage.send .envw{opacity:1;transform:none}
.stage.send .sheet{opacity:0;transform:scale(.88) translateY(-12px);pointer-events:none}
.stage.send .fold{opacity:1}.stage.in .fold{transform:translateY(40px)}
.stage.sealed .seal{opacity:1;transform:rotate(-8deg)}
.env.flip{transform:rotateY(180deg)}
.env.stamped .pm{animation:slam .5s forwards}
@keyframes slam{60%{opacity:.9;transform:scale(.95) rotate(-4deg)}100%{opacity:.8;transform:scale(1) rotate(-4deg)}}
.stage.gone .envw{animation:fly 1.1s cubic-bezier(.5,0,.3,1) forwards}
@keyframes fly{35%{transform:translate(40px,-60px) rotate(6deg)}100%{transform:translate(120%,-320px) rotate(-16deg) scale(.5);opacity:0}}
.shake{animation:shake .45s}@keyframes shake{25%{translate:-6px 0}50%{translate:6px 0}75%{translate:-3px 0}}

.actions{display:grid;grid-template-columns:auto 1fr;gap:12px;margin-top:26px}
.btn{height:56px;border-radius:10px;padding:0 20px;font-family:Fraunces,serif;font-size:18px;font-weight:700;transition:transform .15s,box-shadow .15s}.btn:active{transform:translateY(2px)}
.btn-ghost{border:1.5px solid rgba(42,33,25,.35);background:rgba(255,252,242,.5)}
.btn-send{background:var(--red);color:#fff;box-shadow:0 5px 0 #8e2513,0 14px 22px -10px rgba(194,59,34,.6)}.btn-send:active{box-shadow:0 2px 0 #8e2513}
.foot{text-align:center;font-size:10px;letter-spacing:3px;color:var(--muted);margin-top:28px}
#board h2{font-family:Caveat,cursive;font-size:52px;font-weight:700;transform:rotate(-2deg)}
#board .cp{font-size:11px;letter-spacing:2px;color:var(--muted);margin:2px 0 22px;text-transform:uppercase}
.notes{display:grid;gap:20px}
.note{background:#f3e8cd var(--grain);padding:18px;position:relative;transform:rotate(var(--r));box-shadow:0 10px 16px -10px rgba(42,33,25,.45);animation:pop .6s cubic-bezier(.2,1.3,.4,1) both;animation-delay:var(--d)}
.note::before{content:"";position:absolute;top:-8px;left:50%;width:64px;height:16px;margin-left:-32px;background:rgba(240,226,170,.85);transform:rotate(-2deg)}
.note .tag{font-size:9.5px;letter-spacing:2px;display:flex;justify-content:space-between}
.note .body{font-family:'Cormorant Garamond',serif;font-style:italic;font-weight:600;font-size:22px;line-height:28px;margin:8px 0}
.note .to{font-family:'La Belle Aurore',cursive;font-size:16px;opacity:.8}
@keyframes pop{from{opacity:0;transform:translateY(16px) rotate(calc(var(--r) - 4deg))}}
.overlay{position:fixed;inset:0;z-index:50;display:grid;place-items:center;padding:24px;background:rgba(42,33,25,.5);opacity:0;pointer-events:none;transition:opacity .4s}.overlay.on{opacity:1;pointer-events:auto}
.card{background:#f3e8cd var(--grain);padding:26px 24px 22px;max-width:320px;text-align:center;transform:translateY(20px) rotate(-2deg);transition:transform .6s cubic-bezier(.2,1.3,.4,1);box-shadow:0 30px 50px -20px #000}
.overlay.on .card{transform:rotate(-1deg)}
.card h3{font-family:Caveat,cursive;font-size:46px;line-height:1}.card p{font-size:11px;letter-spacing:2px;color:var(--muted);margin:8px 0 16px}
.card button{padding:12px 22px;border-radius:99px;background:var(--ink);color:var(--bg);font-family:Fraunces,serif;font-weight:700}
.card a{display:inline-block;padding:12px 22px;border-radius:99px;background:var(--ink);color:var(--bg);font-family:Fraunces,serif;font-weight:700;text-decoration:none;font-size:13px}
.cf{position:fixed;top:-20px;width:9px;height:13px;z-index:60;pointer-events:none;animation:fall linear forwards}@keyframes fall{to{transform:translateY(105vh) rotate(720deg)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
/* ---- tema: ruang tulis malam, bercahaya lilin ---- */
body{background:linear-gradient(180deg,#0e1220,#161926 55%,#26171a);color:#efe3c8}
body::before{content:"";position:fixed;inset:0;z-index:0;pointer-events:none;background:radial-gradient(ellipse at 50% 45%,transparent 40%,rgba(0,0,0,.65))}
.glow{position:fixed;inset:0;z-index:0;pointer-events:none;background:radial-gradient(ellipse 75% 42% at 50% 58%,rgba(255,176,90,.3),transparent 72%);animation:flick 5s ease-in-out infinite}
@keyframes flick{0%,100%{opacity:.85}30%{opacity:1}55%{opacity:.76}75%{opacity:.95}}
.bgword{position:fixed;left:50%;top:48%;z-index:0;pointer-events:none;white-space:nowrap;transform:translate(-50%,-50%) rotate(-8deg);font:italic 600 52vw/1 'Cormorant Garamond',serif;color:rgba(240,223,184,.035)}

@keyframes rise{0%{transform:translate(0,0);opacity:0}10%{opacity:.8}50%{transform:translate(18px,-55vh)}90%{opacity:.6}100%{transform:translate(-14px,-110vh);opacity:0}}

</style>

<body>
<div class="glow"></div><div class="bgword">Aksara</div><div id="motes"></div>
<header><div class="logo">AKSARA<b>.</b></div><nav><a class="nv" href="index.html">MADING</a><a class="nv" href="profil.html">PROFIL</a><button id="tK" class="on">KIRIM</button></nav></header>
<main>
<section id="kirim">
  <div class="hero">
    <svg class="stamp" viewBox="0 0 120 120" aria-hidden="true">
      <defs><path id="c" d="M60,60 m-42,0 a42,42 0 1,1 84,0 a42,42 0 1,1 -84,0"/></defs>
      <circle cx="60" cy="60" r="58" fill="none" stroke="#c23b22" stroke-width="2"/>
      <circle cx="60" cy="60" r="31" fill="none" stroke="#c23b22" stroke-width=".8"/>
      <g class="ring"><text font-family="Space Mono,monospace" font-size="9" font-weight="700" fill="#c23b22"><textPath href="#c" textLength="262" lengthAdjust="spacing">AKSARA POST · KANTOR POS REDAKSI ·</textPath></text></g>
      <text id="stD" x="60" y="58" text-anchor="middle" font-family="Fraunces,serif" font-weight="700" font-size="20" fill="#c23b22">30</text>
      <text id="stM" x="60" y="72" text-anchor="middle" font-family="Space Mono,monospace" font-weight="700" font-size="9" fill="#c23b22" letter-spacing="2">OKT</text>
    </svg>
    <div><h1>Tulis suratmu...</h1><p class="sub">Pos kilat redaksi · sampai hari ini juga</p></div>
  </div>
  <div class="verse"><div class="orn">❦</div><p id="verse"></p></div>
  <div class="types" role="group" aria-label="Jenis surat">
    <button class="type" data-t="surat" aria-pressed="true" style="--c:#2c5d8a"><i></i>SURAT</button>
    <button class="type" data-t="anonim" aria-pressed="false" style="--c:#2a2119"><i></i>ANONIM</button>
    <button class="type" data-t="perpisahan" aria-pressed="false" style="--c:#b03a6a"><i></i>PERPISAHAN</button>
    <button class="type" data-t="apresiasi" aria-pressed="false" style="--c:#b8860b"><i></i>APRESIASI</button>
    <button class="type" data-t="manfess" aria-pressed="false" style="--c:#3a3348"><i></i>MANFESS</button>
  </div>
  <p class="hint" id="hint"></p>

  <div class="stage" id="stage">
    <div class="sheet" id="sheet"><div class="paper">
      <div class="row head"><span>❦ AKSARA POST · <span id="lbl" style="letter-spacing:2px;font-style:normal;font-size:9.5px">SURAT</span></span><span id="dt"></span></div>
      <div class="row"><label for="to">Teruntuk</label><input id="to" maxlength="40" placeholder="nama penerima..." autocomplete="off"></div>
      <textarea id="msg" maxlength="600" placeholder="Tulis suratmu di sini..."></textarea>
      <div class="row sal">Salam hangat,</div>
      <div class="row sign"><span>—&nbsp;</span><input id="from" maxlength="40" placeholder="namamu..." autocomplete="off"></div>
    </div></div>

    <div class="envw" id="envw"><div class="env" id="env">
      <div class="fb">
        <div class="back"></div><div class="flap" id="flap"></div>
        <div class="fold"><span id="fTo">Teruntuk ...</span></div>
        <div class="pocket"></div><div class="seal" id="seal">A</div>
      </div>
      <div class="ff"><div class="in">
        <div class="snd">DARI<b id="sName">Seseorang</b></div>
        <svg class="fst" viewBox="0 0 60 72" aria-hidden="true"><rect id="fBg" x="3" y="3" width="54" height="66" fill="#2c5d8a"/><rect x="9" y="9" width="42" height="54" fill="none" stroke="rgba(255,255,255,.7)"/><text id="fIc" x="30" y="40" text-anchor="middle" font-size="24" fill="#fff">✉</text><text x="30" y="56" text-anchor="middle" font-family="Space Mono,monospace" font-size="6.5" letter-spacing="1.5" fill="#fff">AKSARA</text><rect x="3" y="3" width="54" height="66" fill="none" stroke="#f1e6cb" stroke-width="5" stroke-dasharray="0 8" stroke-linecap="round"/></svg>
        <svg class="pm" viewBox="0 0 150 60" aria-hidden="true"><g fill="none" stroke="#3b3a52" stroke-width="1.6"><circle cx="112" cy="30" r="26"/><circle cx="112" cy="30" r="21" stroke-width=".8"/><path d="M0 14q10-6 20 0t20 0t20 0t20 0M0 26q10-6 20 0t20 0t20 0t20 0M0 38q10-6 20 0t20 0t20 0t20 0M0 50q10-6 20 0t20 0t20 0t20 0"/></g><text x="112" y="28" text-anchor="middle" font-family="Special Elite,monospace" font-size="8" fill="#3b3a52">AKSARA</text><text id="pmD" x="112" y="40" text-anchor="middle" font-family="Special Elite,monospace" font-size="7.5" fill="#3b3a52">30 OKT 26</text></svg>
        <div class="rcp">KEPADA YTH.<b id="rName">—</b><span>c/o Kantor Pos Redaksi AKSARA</span></div>
        <div class="pa">VIA UDARA · PAR AVION</div>
      </div></div>
    </div></div>
  </div>
  <div class="under"><span id="cnt">0 / 600</span><label class="switch"><button id="sw" role="switch" aria-checked="false" aria-label="Kirim anonim"></button>Anonim</label></div>
  <div class="actions"><a class="btn btn-ghost" id="toB" href="index.html" style="display:grid;place-items:center;text-decoration:none">Papan</a><button class="btn btn-send" id="send">Tempel Perangko &amp; Kirim</button></div>
  <p class="foot">AKSARA · KANTOR POS REDAKSI</p>
</section>
</main>
<div class="overlay" id="ov" aria-live="polite"><div class="card"><h3>Surat meluncur!</h3><p id="trk"></p><button id="again">Tulis lagi</button></div></div>

<script>
const T={
 surat:{h:"Surat biasa ke teman. Namamu tercantum.",c:"#2c5d8a",l:"SURAT",i:"✉",f:"#d6e5f3",bg:"#d6e5f3",fg:"#1f4466",st:"tanpa",sk:"segel"},
 anonim:{h:"Tanpa nama. Kami janji tutup mulut.",c:"#2a2119",l:"ANONIM",i:"?",f:"#9a8b76",bg:"#2a2119",fg:"#f4ead2",a:1,st:"rahasia",sk:"awan"},
 perpisahan:{h:"Untuk yang pergi, atau yang harus dilepas.",c:"#b03a6a",l:"PERPISAHAN",i:"♥",f:"#f4cfdd",bg:"#f8e3ec",fg:"#8c2a53",st:"love",sk:"hati"},
 apresiasi:{h:"Ucapan terima kasih atau pujian yang tulus.",c:"#b8860b",l:"APRESIASI",i:"★",f:"#f3dd96",bg:"#f6e2a0",fg:"#6b4d00",st:"semangat",sk:"kilau"},
 manfess:{h:"Pengakuan rahasia. Anonim otomatis.",c:"#3a3348",l:"MANFESS",i:"☾",f:"#8f86a8",bg:"#3a3348",fg:"#f4ead2",a:1,st:"rahasia2",sk:"bulan"}};
const $=s=>document.querySelector(s),stage=$("#stage"),env=$("#env"),msg=$("#msg"),to=$("#to"),from=$("#from");
let cur="surat",anon=false,auto=0,posted=[];const wait=(f,ms)=>setTimeout(f,ms);
$("#dt").textContent=new Date().toLocaleDateString("id-ID",{day:"numeric",month:"long",year:"numeric"});
try{var _d=new Date(),_m=["JAN","FEB","MAR","APR","MEI","JUN","JUL","AGU","SEP","OKT","NOV","DES"],_mm=_m[_d.getMonth()];
document.getElementById("stD").textContent=_d.getDate();document.getElementById("stM").textContent=_mm;
document.getElementById("pmD").textContent=_d.getDate()+" "+_mm+" "+String(_d.getFullYear()).slice(2);}catch(e){}

function setType(t){
  cur=t;const c=T[t];
  document.querySelectorAll(".type").forEach(b=>b.setAttribute("aria-pressed",b.dataset.t===t));
  $("#hint").textContent=c.h;$("#lbl").textContent=c.l;
  $("#fBg").setAttribute("fill",c.c);$("#fIc").textContent=c.i;
  document.documentElement.style.setProperty("--accent",c.c);
  stage.style.setProperty("--c",c.c);stage.style.setProperty("--flap",c.f);
  if(c.a){setAnon(true);auto=1}else if(auto){setAnon(false);auto=0}
}
function setAnon(v){anon=v;$("#sw").setAttribute("aria-checked",v);from.disabled=v;from.placeholder=v?"tanpa nama":"namamu...";from.style.opacity=v?.35:1}
document.querySelectorAll(".type").forEach(b=>b.onclick=()=>setType(b.dataset.t));
$("#sw").onclick=()=>{auto=0;setAnon(!anon)};
msg.oninput=()=>$("#cnt").textContent=msg.value.length+" / 600";

$("#send").onclick=()=>{
  if(!msg.value.trim()){const s=$("#sheet");s.classList.remove("shake");void s.offsetWidth;s.classList.add("shake");msg.focus();return}
  const rcv=to.value.trim()||"Seseorang";
  $("#fTo").textContent="Teruntuk "+rcv+",";$("#rName").textContent=rcv;
  $("#sName").textContent=anon?"— tanpa nama —":(from.value.trim()||"Seseorang");
  stage.classList.add("send");
  wait(()=>stage.classList.add("in"),700);
  wait(()=>$("#flap").classList.add("shut"),1900);
  wait(()=>stage.classList.add("sealed"),2600);
  wait(()=>env.classList.add("flip"),3200);
  wait(()=>env.classList.add("stamped"),4200);
  wait(()=>{stage.classList.add("gone");confetti();save();$("#trk").textContent="RESI AKS-"+Math.random().toString(36).slice(2,6).toUpperCase()},5000);
  wait(()=>$("#ov").classList.add("on"),5900);
};
$("#again").onclick=()=>{
  $("#ov").classList.remove("on");
  wait(()=>{
    stage.className="stage";env.className="env";$("#flap").classList.remove("shut");
    msg.value=to.value=from.value="";$("#cnt").textContent="0 / 600";setAnon(false);auto=0;setType("surat");
  },400);
};
function save(){
  var rcv=to.value.trim()||"Seseorang",snd=anon?"???":(from.value.trim()||"Seseorang"),c=T[cur];
  posted.unshift({t:cur,to:rcv,from:snd});
  try{
        var log=[];try{log=JSON.parse(localStorage.getItem("aksara_kiriman_v1"))||[]}catch(e){}
    log.push({kind:cur,to:rcv,from:anon?"Anonim":snd,isi:msg.value.trim().slice(0,500),at:Date.now()});
    localStorage.setItem("aksara_kiriman_v1",JSON.stringify(log));
  }catch(e){}
}
function confetti(){const k=["#c23b22","#2c5d8a","#f6e2a0","#b03a6a","#2a2119"];for(let i=0;i<40;i++){const e=document.createElement("i");e.className="cf";e.style.cssText=`left:${Math.random()*100}vw;background:${k[i%5]};animation-duration:${1.6+Math.random()*1.4}s;animation-delay:${Math.random()*.4}s`;document.body.appendChild(e);wait(()=>e.remove(),3500)}}
const V=["Ada kata yang hanya berani pulang lewat tulisan.","Surat adalah rindu yang belajar berjalan.","Tinta mengering, perasaan tidak.","Tulis saja. Alamat akan menemukan jalannya.","Setiap amplop menyimpan satu keberanian kecil."];
let vi=0;const ve=$("#verse");ve.textContent=V[0];
setInterval(()=>{ve.style.opacity=0;wait(()=>{vi=(vi+1)%V.length;ve.textContent=V[vi];ve.style.opacity=1},700)},6500);
const mo=$("#motes");for(let i=0;i<16;i++){const m=document.createElement("i");m.className="mote";const s=2+Math.random()*3;m.style.cssText=`left:${Math.random()*100}%;width:${s}px;height:${s}px;animation-duration:${14+Math.random()*14}s;animation-delay:-${Math.random()*20}s`;mo.appendChild(m)}
setType("surat");
</script>
</body>
</html>
