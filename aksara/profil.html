<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>AKSARA. — Profilku</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;600&family=Fraunces:ital,opsz,wght@0,9..144,400..800;1,9..144,400..700&family=IBM+Plex+Mono:wght@400;500&family=Spectral:ital,wght@0,400;0,500;1,400;1,500&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#F2ECDE; --news:#F7F1E1; --ink:#221D15;
  --red:#C03B21; --fd:'Fraunces',serif; --fs:'Spectral',serif; --fm:'IBM Plex Mono',monospace; --fh:'Caveat',cursive;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--paper);color:var(--ink);font-family:var(--fs);-webkit-text-size-adjust:100%}
.grain{position:fixed;inset:0;z-index:0;pointer-events:none;opacity:.07;
  background-image:url("data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAYAAAAfFcSJAAAADUlEQVR42mNk+M9QDwADhgGAWjR9awAAAABJRU5ErkJggg==")}
.topnav{position:sticky;top:0;z-index:20;display:flex;justify-content:space-between;align-items:center;
  padding:10px clamp(14px,5vw,26px);background:rgba(242,236,222,.94);backdrop-filter:blur(6px);
  border-bottom:1px solid rgba(34,29,21,.25)}
.brand{font:800 1.25rem var(--fd);letter-spacing:.02em}
.brand i{color:var(--red);font-style:normal}
.navlink{display:flex;gap:4px}
.navlink a{font:500 10px var(--fm);letter-spacing:.12em;text-transform:uppercase;color:var(--ink);
  text-decoration:none;padding:7px 12px;border-radius:99px}
.navlink a.on{background:var(--ink);color:var(--paper)}
.shell{position:relative;z-index:1;max-width:640px;margin:0 auto;padding:0 clamp(14px,5vw,26px) 60px}
.mast{text-align:center;padding:20px 0 8px;border-bottom:3px double var(--ink)}
.mast .kick{font:500 9.5px var(--fm);letter-spacing:.22em;color:rgba(34,29,21,.6)}
.mast h1{font:800 clamp(2.4rem,9vw,3.2rem)/1 var(--fd);letter-spacing:-.01em}
.mast h1 i{color:var(--red);font-style:normal}
.ed{display:flex;justify-content:space-between;gap:8px;padding:7px 2px;font:500 10px var(--fm);
  letter-spacing:.12em;text-transform:uppercase;border-bottom:1px solid rgba(34,29,21,.25)}
/* kartu identitas */
.idcard{background:var(--news);border:1px solid rgba(34,29,21,.22);border-radius:14px;
  padding:22px 18px 18px;margin-top:14px;position:relative;overflow:hidden;
  display:grid;grid-template-columns:104px 1fr;gap:15px;text-align:left;align-items:start}
.idcard::before{content:"";position:absolute;top:0;left:0;right:0;height:7px;
  background:repeating-linear-gradient(90deg,var(--red) 0 14px,var(--paper) 14px 20px,#2b241c 20px 34px,var(--paper) 34px 40px)}
.idcard::after{content:"AKSARA · KARTU PELAJAR";position:absolute;bottom:0;left:0;right:0;
  font:700 8px var(--fm);letter-spacing:.24em;color:rgba(242,236,222,.92);text-align:center;
  background:var(--ink);padding:6px 0 7px}
.idcard .idbody{padding-bottom:22px;min-width:0}
.ava{width:104px;height:126px;border-radius:10px;margin:0;display:grid;place-items:center;
  font:700 2rem var(--fd);color:#fff;text-shadow:0 1px 2px rgba(0,0,0,.3);
  border:3px solid rgba(34,29,21,.3);box-shadow:0 3px 6px rgba(24,20,16,.25)}
.idcard h2{font:800 1.35rem/1.2 var(--fd);word-break:break-word}
.idcard .cls{font:500 11px var(--fm);letter-spacing:.12em;text-transform:uppercase;color:rgba(34,29,21,.55);margin:5px 0}
.role{display:inline-block;font:600 10px var(--fm);letter-spacing:.1em;text-transform:uppercase;
  color:var(--red);border:1.5px solid rgba(192,59,33,.6);border-radius:99px;padding:4px 12px;margin-top:2px}
.bio{font:italic 400 .92rem/1.6 var(--fs);color:rgba(34,29,21,.8);margin:10px 0 0}
.idempty{grid-column:1/-1;text-align:center}
.idempty .ava{margin:0 auto}
@media(max-width:380px){ .idcard{grid-template-columns:88px 1fr} .ava{width:88px;height:108px} }
/* statistik */
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.stat{background:rgba(255,255,255,.45);border:1px solid rgba(34,29,21,.2);border-radius:12px;
  padding:13px 10px;text-align:center}
.stat b{display:block;font:800 1.6rem var(--fd)}
.stat span{font:500 9.5px var(--fm);letter-spacing:.12em;text-transform:uppercase;color:rgba(34,29,21,.55)}
/* karya terakhir */
.sect{font:800 1.05rem var(--fd);margin:22px 0 2px}
.sect-sub{font:italic 400 .84rem var(--fs);color:rgba(34,29,21,.55);margin-bottom:10px}
.work{background:var(--news);border:1px solid rgba(34,29,21,.2);border-radius:12px;padding:11px 14px;
  margin-bottom:8px;display:flex;gap:11px;align-items:baseline}
.work .k{flex:0 0 auto;font:700 9px var(--fm);letter-spacing:.1em;text-transform:uppercase;color:var(--red);
  border:1.5px solid rgba(192,59,33,.55);border-radius:6px;padding:3px 7px}
.work p{font:400 .92rem/1.5 var(--fs);word-break:break-word}
.nil{text-align:center;font:italic 400 .92rem var(--fs);color:rgba(34,29,21,.55);padding:22px 0}
.row{display:flex;gap:9px;margin-top:14px}
.btn{background:var(--ink);color:var(--paper);border:0;border-radius:9px;padding:12px 20px;
  font:600 .94rem var(--fd);cursor:pointer;text-decoration:none;text-align:center}
.btn.grow{flex:1}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid rgba(34,29,21,.24);font:500 .92rem var(--fs)}
/* lembar edit */
.sheet{position:fixed;inset:0;z-index:100;display:none;align-items:flex-end;justify-content:center;
  background:rgba(24,20,16,.45)}
.sheet.open{display:flex}
.panel{width:min(520px,100%);background:var(--paper);border-radius:18px 18px 0 0;border-top:2px solid var(--ink);
  padding:18px clamp(16px,5vw,26px) calc(20px + env(safe-area-inset-bottom));max-height:88vh;overflow-y:auto;
  animation:up .28s cubic-bezier(.2,.8,.3,1) both}
@keyframes up{from{transform:translateY(28px);opacity:.6}to{transform:none;opacity:1}}
.panel h3{font:600 1.06rem var(--fd);margin-bottom:12px}
.field{margin-bottom:11px}
.field label{display:block;font:500 10px var(--fm);letter-spacing:.14em;text-transform:uppercase;
  color:rgba(34,29,21,.55);margin-bottom:5px}
.field input,.field select,.field textarea{width:100%;font:400 1rem var(--fs);color:var(--ink);
  background:rgba(255,255,255,.55);border:1px solid rgba(34,29,21,.22);border-radius:9px;padding:10px 12px}
.field input:focus,.field select:focus,.field textarea:focus{outline:none;border-color:var(--red)}
.field textarea{min-height:74px;resize:none}
.swatches{display:flex;gap:9px}
.sw{width:36px;height:36px;border-radius:50%;border:2px solid rgba(34,29,21,.3);cursor:pointer;padding:0}
.sw[aria-pressed="true"]{box-shadow:0 0 0 2px var(--paper),0 0 0 4px var(--red)}
.toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%);z-index:130;background:rgba(34,29,21,.93);
  color:var(--paper);padding:10px 18px;border-radius:99px;font:500 .86rem var(--fs);
  opacity:0;pointer-events:none;transition:opacity .26s}
.toast.show{opacity:1}
footer{text-align:center;font:500 10px var(--fm);letter-spacing:.14em;color:rgba(34,29,21,.45);
  padding:26px 0 8px;text-transform:uppercase}
</style>
</head>
<body>
<div class="grain" aria-hidden="true"></div>

<nav class="topnav">
  <span class="brand">AKSARA<i>.</i></span>
  <div class="navlink">
    <a href="index.html">Mading</a>
    <a href="profil.html" class="on">Profil</a>
    <a href="#" data-soon="Kirim">Kirim</a>
  </div>
</nav>

<main class="shell">
  <header class="mast">
    <p class="kick">DITERBITKAN MPK · OSIS — WAJIB DIBACA, TIDAK WAJIB PERCAYA</p>
    <h1>PROFIL<i>.</i></h1>
  </header>
  <div class="ed">
    <span>EDISI <b>231</b></span>
    <span id="edDate">—</span>
    <span>HARGA: <b>1 SENYUM</b></span>
  </div>

  <section class="idcard" id="idcard"></section>

  <div class="stats">
    <div class="stat"><b id="stTempel">0</b><span>Tempelan di papan</span></div>
    <div class="stat"><b id="stKarya">0</b><span>Karyaku</span></div>
  </div>

  <div class="row">
    <button class="btn ghost" id="editBtn">Ubah profil</button>
    <a class="btn grow" href="index.html">Tempel di papan</a>
  </div>

  <h2 class="sect">Karya Terakhirku</h2>
  <p class="sect-sub">Tempelan terbaru dari papan mading.</p>
  <div id="works"></div>

  <footer>AKSARA · HAL. 2/3 · EDISI 231</footer>
</main>

<div class="sheet" id="sheet">
  <div class="panel">
    <h3>Ubah profil</h3>
    <div class="field">
      <label for="fNama">Nama</label>
      <input id="fNama" maxlength="40" placeholder="Namamu...">
    </div>
    <div class="field">
      <label for="fKelas">Kelas</label>
      <input id="fKelas" maxlength="12" placeholder="cth: XI-4">
    </div>
    <div class="field">
      <label for="fPeran">Peran</label>
      <select id="fPeran">
        <option>Anggota</option>
        <option>Ketua OSIS</option>
        <option>Wakil Ketua</option>
        <option>Sekretaris</option>
        <option>Bendahara</option>
        <option>Redaktur</option>
        <option>Koordinator Acara</option>
      </select>
    </div>
    <div class="field">
      <label>Warna avatar</label>
      <div class="swatches" id="swatches"></div>
    </div>
    <div class="field">
      <label for="fBio">Tentangku</label>
      <textarea id="fBio" maxlength="220" placeholder="Ceritakan sedikit tentangmu..."></textarea>
    </div>
    <div class="row">
      <button class="btn ghost" id="cancelBtn">Batal</button>
      <button class="btn grow" id="saveBtn">Simpan</button>
    </div>
  </div>
</div>
<div class="toast" id="toast"></div>

<script>
(function(){
  "use strict";
  var KEY = "aksara_profil_v1";
  var BOARD_KEY = "aksara_papan_v1";
  var COLORS = ["#C03B21", "#2C5E9E", "#3E6B35", "#7B4B94", "#B4536B", "#8A6A10"];
  var KIND_LABEL = { note: "Note", polaroid: "Foto", clip: "Kliping", tiket: "Tiket", pita: "Pita", perangko: "Perangko", amplop: "Amplop", tag: "Tag", struk: "Struk", umbul: "Umbul", balon: "Balon", badge: "Badge", tulis: "Tulis", lampu: "Lampu", lampion: "Lampion", layang: "Layang", kipas: "Kipas", rantai: "Rantai" };

  var card = document.getElementById("idcard");
  var sheet = document.getElementById("sheet");
  var toast = document.getElementById("toast");
  var sayT = null;
  function say(m){ toast.textContent = m; toast.classList.add("show"); clearTimeout(sayT); sayT = setTimeout(function(){ toast.classList.remove("show"); }, 2200); }

  try{
    var dd = new Date();
    document.getElementById("edDate").textContent = dd.toLocaleDateString("id-ID", { day: "numeric", month: "long", year: "numeric" }).toUpperCase();
  }catch(e){}

  function load(){
    try{
      var d = JSON.parse(localStorage.getItem(KEY));
      if(d && typeof d === "object") return d;
    }catch(e){}
    return null;
  }
  function initial(nama){
    var p = (nama || "").trim().split(/\s+/).filter(Boolean);
    if(!p.length) return "?";
    return p.map(function(w){ return w[0]; }).slice(0, 2).join("").toUpperCase();
  }
  function boardItems(){
    try{
      var d = JSON.parse(localStorage.getItem(BOARD_KEY));
      return Array.isArray(d) ? d : [];
    }catch(e){ return []; }
  }
  function escapeHtml(s){
    return String(s == null ? "" : s).replace(/[&<>"']/g, function(c){
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }

  function render(){
    var p = load();
    if(!p){
      card.innerHTML = '<div class="idempty"><div class="ava" style="background:#8A8578">?</div>' +
        "<h2>Belum ada nama</h2>" +
        '<p class="cls">Ketuk Ubah profil untuk mengisi identitasmu</p></div>';
    } else {
      card.innerHTML = '<div class="ava" style="background:' + p.warna + '">' + initial(p.nama) + "</div>" +
        '<div class="idbody"><h2>' + escapeHtml(p.nama) + "</h2>" +
        '<p class="cls">' + escapeHtml(p.kelas) + "</p>" +
        '<span class="role">' + escapeHtml(p.peran) + "</span>" +
        (p.bio ? '<p class="bio">“' + escapeHtml(p.bio) + "”</p>" : "") + "</div>";
    }
    var items = boardItems();
    document.getElementById("stTempel").textContent = items.length;
    document.getElementById("stKarya").textContent = items.length;
    var box = document.getElementById("works");
    box.innerHTML = "";
    if(!items.length){
      box.innerHTML = '<p class="nil">Belum ada tempelan. Yuk tempel yang pertama di papan!</p>';
      return;
    }
    items.slice(-3).reverse().forEach(function(d){
      var w = document.createElement("div");
      w.className = "work";
      var t = (d.text || "").trim() || "(tanpa tulisan)";
      if(t.length > 90) t = t.slice(0, 90) + "…";
      w.innerHTML = '<span class="k">' + (KIND_LABEL[d.kind] || "Karya") + "</span><p>" + escapeHtml(t) + "</p>";
      box.appendChild(w);
    });
  }

  var curColor = COLORS[0];
  function paintSwatches(){
    var box = document.getElementById("swatches");
    box.innerHTML = "";
    COLORS.forEach(function(c){
      var b = document.createElement("button");
      b.type = "button";
      b.className = "sw";
      b.style.background = c;
      b.setAttribute("aria-pressed", c === curColor ? "true" : "false");
      b.setAttribute("aria-label", c);
      b.addEventListener("click", function(){
        curColor = c;
        [].forEach.call(box.children, function(o){
          o.setAttribute("aria-pressed", o === b ? "true" : "false");
        });
      });
      box.appendChild(b);
    });
  }

  document.getElementById("editBtn").onclick = function(){
    var p = load() || {};
    document.getElementById("fNama").value = p.nama || "";
    document.getElementById("fKelas").value = p.kelas || "";
    document.getElementById("fPeran").value = p.peran || "Anggota";
    document.getElementById("fBio").value = p.bio || "";
    curColor = p.warna || COLORS[0];
    paintSwatches();
    sheet.classList.add("open");
  };
  document.getElementById("cancelBtn").onclick = function(){ sheet.classList.remove("open"); };
  sheet.addEventListener("click", function(e){ if(e.target === sheet) sheet.classList.remove("open"); });
  document.getElementById("saveBtn").onclick = function(){
    var nama = document.getElementById("fNama").value.trim();
    if(!nama){ say("Isi dulu namamu"); return; }
    try{
      localStorage.setItem(KEY, JSON.stringify({
        nama: nama,
        kelas: document.getElementById("fKelas").value.trim() || "—",
        peran: document.getElementById("fPeran").value,
        warna: curColor,
        bio: document.getElementById("fBio").value.trim()
      }));
    }catch(e){ say("Gagal menyimpan"); return; }
    sheet.classList.remove("open");
    render();
    say("Profil disimpan");
  };
  document.querySelectorAll("[data-soon]").forEach(function(el){
    el.addEventListener("click", function(e){
      e.preventDefault();
      say(el.getAttribute("data-soon") + " — segera hadir");
    });
  });

  render();
})();
</script>
</body>
</html>
