<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Konsep 2 — Meja Surat | Tharra</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600;700&family=Fraunces:opsz,wght@9..144,600..900&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/* KONSEP 2 — Meja dengan dua amplop.
   Ide: beranda bukan halaman, tapi meja. Dua amplop bersegel menunggu dibuka.
   Hanya dua pilihan, tanpa menu, tanpa daftar. */
:root{
  --desk:#E4D6BC; --desk-2:#D9C7A6; --paper:#FBF6E9; --ink:#2B2419;
  --red:#A6321B; --wax:#8C2F1D; --green:#3F5A38; --fm:"IBM Plex Mono",monospace;
}
*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0;background:
    radial-gradient(120% 90% at 50% 0%, #EFE3CB 0%, var(--desk) 45%, var(--desk-2) 100%);
  color:var(--ink);font-family:var(--fm);
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  padding:26px 18px;min-height:100dvh;overflow-x:hidden;
}
/* tekstur meja: garis serat kayu tipis */
body::before{
  content:"";position:fixed;inset:0;pointer-events:none;opacity:.5;
  background:repeating-linear-gradient(92deg, rgba(120,90,50,.07) 0 2px, transparent 2px 9px);
}

.top{
  position:fixed;top:0;left:0;right:0;display:flex;justify-content:space-between;
  padding:14px 18px;font-size:9px;letter-spacing:.24em;text-transform:uppercase;
  color:rgba(43,36,25,.55);
}
.top b{letter-spacing:.3em;color:rgba(43,36,25,.8)}

.intro{text-align:center;position:relative;z-index:1;margin-bottom:26px}
.intro h1{
  font-family:"Fraunces",serif;font-weight:800;font-size:clamp(30px,7vw,46px);
  margin:0;letter-spacing:-.02em;
}
.intro p{
  margin:8px 0 0;font-size:10.5px;letter-spacing:.2em;text-transform:uppercase;
  color:rgba(43,36,25,.55);
}

.desk{display:flex;gap:18px;flex-wrap:wrap;justify-content:center;position:relative;z-index:1}

/* ---- amplop ---- */
.letter{
  position:relative;width:min(78vw,270px);height:172px;text-decoration:none;color:inherit;
  background:linear-gradient(158deg,#FCF7EA 0%,#F1E7D2 100%);
  border:1px solid #C9B48C;border-radius:5px;
  box-shadow:0 18px 30px -22px rgba(60,45,25,.85), 0 2px 0 rgba(255,255,255,.5) inset;
  transform:rotate(var(--rot,-1.5deg));
  transition:transform .45s cubic-bezier(.19,1,.22,1), box-shadow .45s ease;
  display:block;
}
.letter:hover{transform:rotate(0deg) translateY(-6px);box-shadow:0 30px 46px -26px rgba(60,45,25,.9)}
.letter:focus-visible{outline:2px solid var(--red);outline-offset:4px}

/* lipatan amplop */
.letter::before{
  content:"";position:absolute;inset:0;border-radius:5px;
  background:
    linear-gradient(to bottom right, transparent 49.5%, rgba(160,132,90,.55) 49.5%, rgba(160,132,90,.55) 50.5%, transparent 50.5%),
    linear-gradient(to bottom left, transparent 49.5%, rgba(160,132,90,.55) 49.5%, rgba(160,132,90,.55) 50.5%, transparent 50.5%);
}
/* tutup atas */
.letter::after{
  content:"";position:absolute;left:0;right:0;top:0;height:52%;
  background:linear-gradient(180deg,#F6EEDB,#EFE3CA);
  clip-path:polygon(0 0,100% 0,50% 100%);
  border-bottom:1px solid rgba(160,132,90,.4);
  border-radius:5px 5px 0 0;
}

/* isi amplop (teks) */
.letter .label{
  position:absolute;left:16px;right:16px;bottom:14px;z-index:3;
}
.letter .label strong{
  display:block;font-family:"Fraunces",serif;font-weight:800;
  font-size:23px;letter-spacing:-.01em;line-height:1;
}
.letter .label span{
  display:block;margin-top:5px;font-size:8.5px;letter-spacing:.2em;text-transform:uppercase;
  color:rgba(43,36,25,.55);
}

/* segel lilin */
.seal{
  position:absolute;right:20px;top:52px;width:44px;height:44px;border-radius:50%;
  display:grid;place-items:center;z-index:4;
  font-family:"Fraunces",serif;font-weight:700;font-size:16px;color:#F6E3C4;
  background:radial-gradient(circle at 34% 30%, #B8482B 0%, var(--wax) 65%, #59180C 100%);
  box-shadow:0 6px 12px -6px rgba(60,15,5,.9), inset 0 -2px 4px rgba(0,0,0,.28);
  transform:rotate(8deg);transition:transform .4s ease;
}
.letter:hover .seal{transform:rotate(-4deg) scale(1.04)}
.letter.k .seal{background:radial-gradient(circle at 34% 30%, #C03B21 0%, #8C2F1D 65%, #5E1D11 100%)}
.letter.a .seal{background:radial-gradient(circle at 34% 30%, #4E7044 0%, #3F5A38 65%, #243520 100%)}

/* tulisan tangan di atas amplop */
.scrawl{
  position:absolute;left:18px;top:16px;z-index:2;
  font-family:"Caveat",cursive;font-size:19px;color:rgba(43,36,25,.62);
  transform:rotate(-2deg);
}

.hint{
  margin-top:26px;font-size:9px;letter-spacing:.24em;text-transform:uppercase;
  color:rgba(43,36,25,.45);position:relative;z-index:1;text-align:center;
}
.back{
  position:fixed;left:0;right:0;bottom:0;padding:12px;text-align:center;
  font-size:9px;letter-spacing:.2em;text-transform:uppercase;color:rgba(43,36,25,.45);
}
.back a{color:inherit;text-decoration:none;border-bottom:1px solid rgba(43,36,25,.25)}

@media(max-width:560px){
  .letter{width:min(86vw,340px);height:162px}
  .intro{margin-bottom:20px}
}
</style>
</head>
<body>

<div class="top">
  <span><b>THARRA</b> · OSIS HUMAS</span>
  <span>MMXXV</span>
</div>

<div class="intro">
  <h1>Dua surat menunggu</h1>
  <p>Pilih amplopnya</p>
</div>

<div class="desk">
  <a class="letter k" href="../index.html" style="--rot:-2.2deg">
    <span class="scrawl">untuk pengurus</span>
    <span class="seal">K</span>
    <span class="label">
      <strong>Katakan.</strong>
      <span>Kotak aspirasi · anonim</span>
    </span>
  </a>

  <a class="letter a" href="../index.html" style="--rot:1.8deg">
    <span class="scrawl">untuk teman sekelas</span>
    <span class="seal">A</span>
    <span class="label">
      <strong>Aksara.</strong>
      <span>Mading &amp; surat · perlu akun</span>
    </span>
  </a>
</div>

<p class="hint">Ketuk salah satu amplop untuk masuk</p>

<div class="back"><a href="index.html">← kembali ke daftar konsep</a></div>

</body>
</html>
