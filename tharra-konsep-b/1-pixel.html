<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Konsep B1 — Pixel | Tharra</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap" rel="stylesheet">
<style>
/* KONSEP B1 — Layar game 8-bit.
   Ide: beranda seperti menu arcade: dua "level", kursor blok, scanline,
   tulisan pixel. Sekali lihat langsung paham: pilih level 01 atau 02. */
:root{
  --bg:#0B0F1A; --bg2:#111827; --green:#5BE58A; --pink:#FF6FB5;
  --cyan:#6FD3FF; --ink:#E8F0FF; --dim:#7C8AA5;
  --px:"Press Start 2P",monospace; --vt:"VT323",monospace;
}
*{box-sizing:border-box}
body{
  margin:0;background:var(--bg);color:var(--ink);font-family:var(--vt);
  min-height:100dvh;display:flex;flex-direction:column;justify-content:center;
  padding:26px 16px;position:relative;overflow-x:hidden;
}
/* scanline + grid */
body::before{
  content:"";position:fixed;inset:0;pointer-events:none;z-index:5;
  background:repeating-linear-gradient(to bottom, rgba(255,255,255,.045) 0 1px, transparent 1px 3px);
}
body::after{
  content:"";position:fixed;inset:0;pointer-events:none;
  background-image:linear-gradient(rgba(91,229,138,.07) 1px, transparent 1px),
                   linear-gradient(90deg, rgba(91,229,138,.07) 1px, transparent 1px);
  background-size:28px 28px;
}

.top{
  position:relative;z-index:2;display:flex;justify-content:space-between;
  font-family:var(--px);font-size:8px;line-height:1.9;color:var(--green);
  letter-spacing:.05em;margin-bottom:26px;
}
.top .blink{animation:blink 1.2s steps(1) infinite;color:var(--pink)}
@keyframes blink{50%{opacity:0}}

.frame{position:relative;z-index:2;width:100%;max-width:820px;margin:0 auto}

.title{
  font-family:var(--px);font-size:clamp(20px,5.4vw,38px);line-height:1.35;
  color:var(--ink);margin:0 0 6px;text-shadow:3px 3px 0 #1E2A44;
}
.title em{font-style:normal;color:var(--green)}
.sub{font-family:var(--vt);font-size:20px;color:var(--dim);margin:0 0 26px}

/* kartu level */
.levels{display:grid;grid-template-columns:1fr 1fr;gap:14px}

.level{
  position:relative;display:block;text-decoration:none;color:var(--ink);
  background:var(--bg2);padding:20px 18px 18px;
  border:3px solid #2A3A5C;
  clip-path:polygon(10px 0,100% 0,100% calc(100% - 10px),calc(100% - 10px) 100%,0 100%,0 10px);
  transition:transform .15s steps(2),border-color .15s linear,background .15s linear;
}
.level:hover,.level:focus-visible{
  border-color:var(--green);background:#152238;transform:translate(-2px,-2px);outline:none;
}
.level.p:hover,.level.p:focus-visible{border-color:var(--pink)}

/* ikon pixel */
.icon{width:44px;height:44px;position:relative;margin-bottom:14px}
.icon::before,.icon::after{content:"";position:absolute;background:currentColor}
.icon.env{color:var(--green)}
.icon.env::before{left:0;top:8px;width:44px;height:28px;box-shadow:0 0 0 4px #0B0F1A inset}
.icon.env::after{left:0;top:8px;width:44px;height:28px;clip-path:polygon(0 0,50% 55%,100% 0,100% 8%,50% 63%,0 8%)}
.icon.brd{color:var(--pink)}
.icon.brd::before{left:2px;top:4px;width:40px;height:34px;box-shadow:0 0 0 4px #0B0F1A inset}
.icon.brd::after{left:9px;top:11px;width:26px;height:4px;box-shadow:0 8px 0 currentColor,0 16px 0 currentColor}

.lv{font-family:var(--px);font-size:8px;color:var(--dim);letter-spacing:.1em}
.level h2{
  font-family:var(--px);font-size:clamp(13px,2.9vw,18px);line-height:1.5;
  margin:10px 0 0;letter-spacing:.02em;
}
.level p{font-family:var(--vt);font-size:17px;line-height:1.45;color:var(--dim);margin:10px 0 16px}
.level .go{
  font-family:var(--px);font-size:8px;color:var(--green);letter-spacing:.08em;
}
.level.p .go{color:var(--pink)}
.level:hover .go::after{content:"_";animation:blink 1s steps(1) infinite}

/* footer */
.foot{
  position:relative;z-index:2;display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;
  margin-top:28px;padding-top:12px;border-top:2px dashed #2A3A5C;
  font-family:var(--px);font-size:7px;line-height:2;color:var(--dim);
}
.foot a{color:var(--dim);text-decoration:none}

@media(max-width:640px){
  .levels{grid-template-columns:1fr}
  body{justify-content:flex-start;padding-top:22px}
}
</style>
</head>
<body>

<div class="top">
  <span>THARRA v1.0</span>
  <span class="blink">● READY</span>
</div>

<div class="frame">
  <h1 class="title">PILIH <em>RUANG</em></h1>
  <p class="sub">Dua level. Satu sekolah.</p>

  <div class="levels">
    <a class="level" href="../index.html">
      <div class="icon env"></div>
      <span class="lv">LEVEL 01</span>
      <h2>KATAKAN</h2>
      <p>Kotak aspirasi. Anonim kalau kamu mau.</p>
      <span class="go">TEKAN UNTUK MASUK</span>
    </a>

    <a class="level p" href="../index.html">
      <div class="icon brd"></div>
      <span class="lv">LEVEL 02</span>
      <h2>AKSARA</h2>
      <p>Mading sekolah dan surat antar teman.</p>
      <span class="go">TEKAN UNTUK MASUK</span>
    </a>
  </div>

  <div class="foot">
    <span>© MMXXV OSIS HUMAS</span>
    <a href="index.html">← KEMBALI</a>
  </div>
</div>

</body>
</html>
