<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Konsep B3 — Peta Sekolah | Tharra</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter:wght@400;500;600&family=Space+Mono:wght@400&display=swap" rel="stylesheet">
<style>
/* KONSEP B3 — Denah sekolah isometrik.
   Ide: beranda adalah peta. Dua bangunan kecil (ruang) berdiri di atas bidang,
   dihubungkan jalan putus-putus. Klik bangunannya, bukan kartu. */
:root{
  --bg:#EFF1EC; --ink:#171A16; --muted:#6B7268; --line:#C9CEC3;
  --kat:#B4472E; --aks:#3F6B4A; --shadow:rgba(23,26,22,.18);
  --serif:"Instrument Serif",Georgia,serif; --sans:"Inter",system-ui,sans-serif;
  --mono:"Space Mono",monospace;
}
*{box-sizing:border-box}
body{
  margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);
  min-height:100dvh;display:flex;flex-direction:column;
  background-image:
    linear-gradient(rgba(23,26,22,.045) 1px,transparent 1px),
    linear-gradient(90deg, rgba(23,26,22,.045) 1px,transparent 1px);
  background-size:32px 32px;
}

header{
  display:flex;justify-content:space-between;align-items:center;gap:12px;
  padding:18px 22px;border-bottom:1px solid var(--line);
}
header .b{font-family:var(--serif);font-size:26px;letter-spacing:-.01em}
header .b i{color:var(--kat);font-style:normal}
header .m{font-family:var(--mono);font-size:9px;letter-spacing:.18em;text-transform:uppercase;color:var(--muted)}

main{flex:1;display:flex;flex-direction:column;justify-content:center;padding:10px 18px 30px;max-width:960px;margin:0 auto;width:100%}

.lead{text-align:center;margin:6px 0 4px}
.lead h1{font-family:var(--serif);font-weight:400;font-size:clamp(30px,6vw,46px);margin:0;letter-spacing:-.01em}
.lead h1 em{font-style:italic;color:var(--kat)}
.lead p{font-family:var(--mono);font-size:9.5px;letter-spacing:.2em;text-transform:uppercase;color:var(--muted);margin:8px 0 0}

/* peta */
.map{
  position:relative;display:flex;justify-content:center;align-items:flex-end;
  gap:clamp(20px,6vw,70px);padding:36px 0 18px;flex-wrap:wrap;
}

/* jalan penghubung */
.path{
  position:absolute;left:50%;top:56%;transform:translate(-50%,-50%);
  width:clamp(90px,26vw,220px);height:2px;
  background-image:linear-gradient(90deg,var(--line) 50%,transparent 50%);
  background-size:10px 2px;
}

.building{
  position:relative;display:block;text-decoration:none;color:inherit;
  width:clamp(150px,38vw,210px);
  transform-style:preserve-3d;
  transition:transform .35s cubic-bezier(.19,1,.22,1);
}
.building:hover{transform:translateY(-8px)}

/* satu bentuk utuh: atap belah ketupat di atas badan */
.shape{
  position:relative;width:100%;height:132px;
  background:linear-gradient(180deg, var(--tint) 0 34%, var(--tint-2) 34%, var(--tint-3) 100%);
  clip-path:polygon(50% 0,100% 27%,100% 73%,50% 100%,0 73%,0 27%);
  filter:drop-shadow(0 14px 16px var(--shadow));
}
.door{
  position:absolute;left:50%;bottom:0;transform:translateX(-50%);
  width:18px;height:30px;background:rgba(0,0,0,.32);
  clip-path:polygon(50% 0,100% 26%,100% 100%,0 100%,0 26%);
}

/* label bangunan */
.tag{
  position:relative;margin-top:8px;text-align:center;
}
.tag b{
  display:block;font-family:var(--serif);font-weight:400;font-size:24px;letter-spacing:-.01em;
}
.tag span{
  display:block;margin-top:2px;font-family:var(--mono);font-size:8.5px;
  letter-spacing:.18em;text-transform:uppercase;color:var(--muted);
}
.tag .dot{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--tint-2);margin-right:5px;vertical-align:1px}

.building.k{--tint:#C9563A;--tint-2:#A5381F;--tint-3:#7E2A16}
.building.a{--tint:#4F7F5A;--tint-2:#39604A;--tint-3:#27473A}

/* keterangan kecil di atas bangunan */
.pin{
  position:relative;display:table;margin:0 auto 10px;
  font-family:var(--mono);font-size:8px;letter-spacing:.14em;text-transform:uppercase;
  color:#2F352E;background:#FFFFFF;padding:3px 8px;border:1px solid #B9C0B4;border-radius:999px;
  box-shadow:0 2px 6px rgba(23,26,22,.08);
}

/* legenda */
.legend{
  display:flex;justify-content:center;gap:18px;flex-wrap:wrap;
  font-family:var(--mono);font-size:9px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);
  border-top:1px solid var(--line);margin-top:10px;padding-top:12px;
}
.legend a{color:inherit;text-decoration:none}

@media(max-width:520px){
  .map{gap:14px;padding-top:26px}
  .building{width:44vw}
  .roof{height:78px}
  .wall{height:60px;margin-top:-32px}
}
</style>
</head>
<body>

<header>
  <div class="b">Tharra<i>.</i></div>
  <div class="m">Peta ruang · MMXXV</div>
</header>

<main>
  <div class="lead">
    <h1>Dua <em>ruang</em> di sekolah yang sama</h1>
    <p>Ketuk bangunannya untuk masuk</p>
  </div>

  <div class="map">
    <span class="path" aria-hidden="true"></span>

    <a class="building k" href="../index.html">
      <span class="pin">anonim</span>
      <div class="shape"><span class="door"></span></div>
      <div class="tag">
        <b>Katakan</b>
        <span><i class="dot"></i>Kotak aspirasi</span>
      </div>
    </a>

    <a class="building a" href="../index.html">
      <span class="pin">perlu akun</span>
      <div class="shape"><span class="door"></span></div>
      <div class="tag">
        <b>Aksara</b>
        <span><i class="dot"></i>Mading &amp; surat</span>
      </div>
    </a>
  </div>

  <div class="legend">
    <span>Tharra — Katakan &amp; Aksara</span>
    <a href="index.html">← daftar konsep</a>
  </div>
</main>

</body>
</html>
